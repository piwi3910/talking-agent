apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: enterprise-ai-demo
  labels: { app: adversarial-e2e }
spec:
  restartPolicy: Never
  containers:
    - name: playwright
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      command: ["bash", "/scripts/runner.sh"]
      env:
        - { name: BASE, value: "https://agent.kw.watteel.lab" }
        - { name: OUT, value: /out }
        - { name: AGENTS, value: "__AGENTS__" }
        - { name: NODE_TLS_REJECT_UNAUTHORIZED, value: "0" }
      volumeMounts:
        - { name: scripts, mountPath: /scripts }
        - { name: out, mountPath: /out }
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { cpu: "2", memory: 2Gi }
  volumes:
    - { name: out, emptyDir: {} }
    - name: scripts
      configMap: { name: __NAME__ }
