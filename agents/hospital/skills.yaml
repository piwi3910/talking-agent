- description: Appointment services
  id: appointment
  instructions: 'Use current backend records. Never invent IDs or availability. Confirm mutations. '
  keywords:
    - appointment
    - book
    - schedule
    - cancel
    - morning
    - dermatolog
    - ahmed
  tools:
    - description: List this patient appointments
      input:
        additionalProperties: false
        properties: {}
        required: []
        type: object
      mutation: false
      name: appointment.list
      timeout_ms: 5000
    - description: Search open calendar slots; non-empty results are displayed directly as the final answer, so complete prerequisite lookups first. Dates are YYYY-MM-DD and time is UTC
      input:
        additionalProperties: false
        properties:
          doctor_id:
            description: optional doctor ID
            type: string
          from:
            description: optional first date YYYY-MM-DD
            type: string
          specialty:
            description: optional specialty
            type: string
          time_preference:
            description: optional morning or afternoon
            enum:
              - morning
              - afternoon
            type: string
          to:
            description: optional last date YYYY-MM-DD
            type: string
        required: []
        type: object
      mutation: false
      name: appointment.availability
      response_mode: records
      timeout_ms: 5000
    - description: Book an available appointment
      input:
        additionalProperties: false
        properties:
          slot_id:
            description: required available slot ID
            type: string
        required:
          - slot_id
        type: object
      mutation: true
      name: appointment.book
      timeout_ms: 5000
    - description: Move an owned appointment to an available slot atomically
      input:
        additionalProperties: false
        properties:
          appointment_id:
            description: required appointment ID
            type: string
          slot_id:
            description: required available slot ID
            type: string
        required:
          - appointment_id
          - slot_id
        type: object
      mutation: true
      name: appointment.reschedule
      timeout_ms: 5000
    - description: Cancel an owned appointment
      input:
        additionalProperties: false
        properties:
          appointment_id:
            description: required appointment ID
            type: string
        required:
          - appointment_id
        type: object
      mutation: true
      name: appointment.cancel
      timeout_ms: 5000
