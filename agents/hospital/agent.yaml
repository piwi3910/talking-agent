    - chest pain
    - cannot breathe
    - can't breathe
    - difficulty breathing
    - shortness of breath
    - unconscious
    - severe bleeding
    - overdose
    - suicide
    - kill myself
    - immediate danger
    - stroke
    - heart attack
    - not breathing
    - can’t breathe
    - unresponsive
