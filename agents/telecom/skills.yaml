  keywords:
    - ticket
  tools:
    - description: List support tickets
      input:
        additionalProperties: false
        properties: {}
        required: []
        type: object
      mutation: false
      name: ticket.list
      timeout_ms: 5000
    - description: Read one owned support ticket
      input:
        additionalProperties: false
        properties:
          ticket_id:
            description: required ticket ID
            type: string
        required:
          - ticket_id
        type: object
      mutation: false
      name: ticket.details
      timeout_ms: 5000
    - description: Create support ticket
      input:
        additionalProperties: false
        properties:
          summary:
            description: required issue summary
            type: string
        required:
          - summary
        type: object
      mutation: true
      name: ticket.create
      timeout_ms: 5000
    - description: Update support ticket
      input:
        additionalProperties: false
        properties:
          status:
            description: required open or closed
            enum:
              - open
              - closed
            type: string
          ticket_id:
            description: required ticket ID
            type: string
        required:
          - ticket_id
          - status
        type: object
      mutation: true
      name: ticket.update
      timeout_ms: 5000
