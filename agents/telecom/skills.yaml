- description: Wifi services
  id: wifi
  instructions: Use current backend records. Never invent IDs or availability. Confirm mutations. Check network.outages and network.status before changing equipment.
  keywords:
    - wifi
    - wi-fi
    - upstairs
    - router
    - channel
  tools:
    - description: Get router channel and health
      input:
        additionalProperties: false
        properties: {}
        required: []
        type: object
      mutation: false
      name: wifi.status
      timeout_ms: 5000
    - description: List connected devices
      input:
        additionalProperties: false
        properties: {}
        required: []
        type: object
      mutation: false
      name: wifi.devices
      timeout_ms: 5000
    - description: Check upstairs coverage and channel interference
      input:
        additionalProperties: false
        properties: {}
        required: []
        type: object
      mutation: false
      name: wifi.diagnostics
      timeout_ms: 5000
    - description: Restart the router; rejects outage, restriction or physical line issue
      input:
        additionalProperties: false
        properties: {}
        required: []
        type: object
      mutation: true
      name: wifi.restart
      timeout_ms: 5000
    - description: Change Wi-Fi channel; rejects outage or physical line issue
      input:
        additionalProperties: false
        properties:
          channel:
            description: 'required channel: 1, 6 or 11'
            enum:
              - "1"
              - "6"
              - "11"
            type: string
        required:
          - channel
        type: object
      memory_effect:
        contains: Interference cleared
        tags:
          - wifi
          - upstairs
          - internet
          - interference
        text: Previous upstairs Wi-Fi interference was resolved by changing channel to {channel}.
      mutation: true
      name: wifi.optimize
      timeout_ms: 5000
- description: Ticket services
  id: ticket
