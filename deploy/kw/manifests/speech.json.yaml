    "name": "speech-deploy-2022c0f3c50a"
  },
  "spec": {
    "backoffLimit": 2,
    "activeDeadlineSeconds": 3600,
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "speech-deploy"
        }
      },
      "spec": {
        "restartPolicy": "Never",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "deploy",
            "image": "192.168.10.131/enterprise-speech-deployer@sha256:fd37ef405204b1e6295fe438baaa03c17bf917916af211bf3a878ee53e534e1c",
            "env": [
              {
                "name": "RELEASE_ID",
                "value": "2022c0f3c50a"
              }
            ],
            "resources": {
