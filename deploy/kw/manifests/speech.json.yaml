                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "release",
                "mountPath": "/release",
                "readOnly": true
              },
              {
                "name": "credentials",
                "mountPath": "/credentials",
                "readOnly": true
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "release",
            "configMap": {
              "name": "speech-release-2022c0f3c50a"
            }
          },
          {
            "name": "credentials",
            "secret": {
              "secretName": "speech-dgx-ssh",
              "defaultMode": 288
            }
          },
          {
            "name": "tmp",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
