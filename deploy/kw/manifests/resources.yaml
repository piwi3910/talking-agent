{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "enterprise-ai-demo",
    "namespace": "enterprise-ai-demo",
    "labels": {
      "app.kubernetes.io/name": "enterprise-ai-demo",
      "app.kubernetes.io/version": "phase1-20260929"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 3,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "enterprise-ai-demo"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "enterprise-ai-demo",
          "app.kubernetes.io/version": "phase1-20260929"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 30,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "demo",
            "image": "192.168.10.131/enterprise-ai-demo@sha256:ec2a17f765fbda3a9f818daa83014b3d58aed9d76327db6e846933e01007d0fa",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "env": [
              {
                "name": "LISTEN_ADDR",
                "value": "0.0.0.0:8080"
              },
              {
                "name": "MEMORY_PROVIDER",
                "value": "in-memory"
              },
              {
                "name": "MAX_ITERATIONS",
                "value": "12"
              },
              {
                "name": "LLM_PROVIDER",
                "value": "openai-compatible"
              },
              {
                "name": "LLM_BASE_URL",
                "value": "http://fastllm-proxy.fastllm.svc.cluster.local/v1"
              },
              {
                "name": "LLM_MODEL",
                "value": "qwen3.5-9b"
              },
              {
                "name": "LLM_API_KEY_ENV",
                "value": "LLM_API_KEY"
              },
              {
                "name": "LLM_API_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "fastllm-api",
                    "key": "LLM_API_KEY"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "http"
              },
              "periodSeconds": 2,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "http"
              },
              "periodSeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "http"
              },
              "periodSeconds": 15,
              "failureThreshold": 3
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "enterprise-ai-demo",
    "namespace": "enterprise-ai-demo",
    "labels": {
      "app.kubernetes.io/name": "enterprise-ai-demo"
    }
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app.kubernetes.io/name": "enterprise-ai-demo"
    },
    "ports": [
      {
        "name": "http",
        "port": 80,
        "targetPort": "http"
      }
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "enterprise-ai-demo",
    "namespace": "enterprise-ai-demo",
    "labels": {
      "app.kubernetes.io/name": "enterprise-ai-demo"
    },
    "annotations": {
      "nginx.ingress.kubernetes.io/proxy-buffering": "off",
      "nginx.ingress.kubernetes.io/proxy-read-timeout": "600",
      "nginx.ingress.kubernetes.io/proxy-send-timeout": "600"
    }
  },
  "spec": {
    "ingressClassName": "nginx",
    "rules": [
      {
        "host": "agent.kw.watteel.lab",
        "http": {
          "paths": [
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "enterprise-ai-demo",
                  "port": {
                    "name": "http"
                  }
                }
              }
            }
          ]
        }
      }
    ],
    "tls": [
      {
        "hosts": [
          "agent.kw.watteel.lab"
        ],
        "secretName": "talking-agent-tls"
      }
    ]
  }
}
---
{
  "apiVersion": "cert-manager.io/v1",
  "kind": "Certificate",
  "metadata": {
    "name": "talking-agent-tls",
    "namespace": "enterprise-ai-demo",
    "labels": {
      "app.kubernetes.io/name": "enterprise-ai-demo"
    }
  },
  "spec": {
    "secretName": "talking-agent-tls",
    "dnsNames": [
      "agent.kw.watteel.lab"
    ],
    "issuerRef": {
      "kind": "ClusterIssuer",
      "name": "cluster-ca"
    }
  }
}
