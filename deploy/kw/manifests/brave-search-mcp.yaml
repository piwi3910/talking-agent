{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata":
    {
      "name": "brave-search-mcp",
      "namespace": "enterprise-ai-demo",
      "labels":
        {
          "app.kubernetes.io/name": "brave-search-mcp",
          "app.kubernetes.io/part-of": "enterprise-ai-demo",
        },
    },
  "spec":
    {
      "replicas": 1,
      "revisionHistoryLimit": 3,
      "selector":
        { "matchLabels": { "app.kubernetes.io/name": "brave-search-mcp" } },
      "template":
        {
          "metadata":
            { "labels": { "app.kubernetes.io/name": "brave-search-mcp" } },
          "spec":
            {
              "automountServiceAccountToken": false,
              "securityContext":
                {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "runAsGroup": 10001,
                  "seccompProfile": { "type": "RuntimeDefault" },
                },
              "containers":
                [
                  {
                    "name": "brave-search-mcp",
                    "image": "docker.io/mcp/brave-search@sha256:f58a5c22c1196ec7bd1ca586ce216f2334fc298550ddcf652c0e8adb6d256d78",
                    "imagePullPolicy": "IfNotPresent",
                    "ports": [{ "name": "http", "containerPort": 8080 }],
                    "env":
                      [
                        { "name": "BRAVE_MCP_TRANSPORT", "value": "http" },
                        { "name": "BRAVE_MCP_HOST", "value": "0.0.0.0" },
                        { "name": "BRAVE_MCP_PORT", "value": "8080" },
                        {
                          "name": "BRAVE_API_KEY",
                          "valueFrom":
                            {
                              "secretKeyRef":
                                {
                                  "name": "brave-search",
                                  "key": "BRAVE_API_KEY",
                                },
                            },
                        },
                      ],
                    "resources":
                      {
                        "requests": { "cpu": "50m", "memory": "96Mi" },
                        "limits": { "cpu": "500m", "memory": "256Mi" },
                      },
                    "securityContext":
                      {
                        "allowPrivilegeEscalation": false,
                        "readOnlyRootFilesystem": true,
                        "capabilities": { "drop": ["ALL"] },
                      },
                    "readinessProbe":
                      {
                        "httpGet": { "path": "/ping", "port": "http" },
                        "periodSeconds": 5,
                      },
                    "livenessProbe":
                      {
                        "httpGet": { "path": "/ping", "port": "http" },
                        "periodSeconds": 20,
                        "failureThreshold": 3,
                      },
                  },
                ],
            },
        },
    },
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata":
    {
      "name": "brave-search-mcp",
      "namespace": "enterprise-ai-demo",
      "labels":
        {
          "app.kubernetes.io/name": "brave-search-mcp",
          "app.kubernetes.io/part-of": "enterprise-ai-demo",
        },
    },
  "spec":
    {
      "type": "ClusterIP",
      "selector": { "app.kubernetes.io/name": "brave-search-mcp" },
      "ports": [{ "name": "http", "port": 8080, "targetPort": "http" }],
    },
}
