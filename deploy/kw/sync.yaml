apiVersion: sync.kuvryn.io/v1alpha1
kind: Repository
metadata:
  name: talking-agent
  namespace: enterprise-ai-demo
spec:
  type: git
  git:
    url: https://github.com/piwi3910/talking-agent.git
    revision: main
  pollInterval: 1m
---
apiVersion: sync.kuvryn.io/v1alpha1
kind: Application
metadata:
  name: talking-agent
  namespace: enterprise-ai-demo
spec:
  source:
    repositoryRef:
      name: talking-agent
    revision: main
    path: deploy/kw/manifests
    render:
      type: yaml
  destination:
    namespace: enterprise-ai-demo
  serviceAccountName: kuvryn-sync-deployer
  sync:
    automatic: true
    conflictPolicy: adopt
    # Service-owned EndpointSlices inherit Sync labels; pruning them causes 503s.
    # Keep explicit resource removal until Sync excludes controller-owned children.
    prune: false
    selfHeal: true
  deletionPolicy: Orphan
  health:
    timeout: 30m
  history:
    limit: 5
  strategy:
    type: rolling
    failurePolicy:
      action: rollback
      maxAttempts: 2
      timeout: 30m
